name: 'images'
description: 'Build container images'
inputs:
  build-opts: 
    description: 'build options in YAML format (see README.md)'
    required: true
  registry: 
    description: 'registry'
    required: true
  tag:
    description: 'image tag'
    required: true
  tag-on-git-tag:
    description: 'image tag when build is triggered by a git tag (supports same templates as tag)'
    required: false
    default: ''
  platforms:
    description: 'platforms'
    required: false
    default: ''
  operation:
    description: '<push|build|build-and-push>'
    required: true
  latest:
    description: 'latest tag'
    required: false
    default: 'false'
  cache-from:
    description: 'cache from https://docs.docker.com/build/ci/github-actions/cache/'
    required: false
    default: ''
  cache-to:
    description: 'cache from https://docs.docker.com/build/ci/github-actions/cache/'
    required: false
    default: ''
  github-token: 
    description: 'github token'
    required: false
    default: ''
  repo-name:
    description: 'override repo name'
    required: false
    default: ''
  ci:
    description: 'only build with tmp tag'
    required: false
    default: 'false'
  ci-tag:
    description: 'tmp tag for ci build'
    required: false
    default: '{{ commit }}'
  push-retries:
    description: 'number of attempts for docker push on failure (exponential backoff: 2s, 4s, 8s, ... capped at 60s)'
    required: false
    default: '30'
    
outputs:
  copy-files:
    description: 'copy files'
  build-opts:
    description: 'build opts'
  pushed-images:
    description: 'pushed images'
  built-images:
    description: 'built images'

runs:
  using: 'node24'
  main: 'dist/main.js'